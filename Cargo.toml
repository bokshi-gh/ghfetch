[package]
name = "ghfetch"
version = "0.1.0"
edition = "2024"
description = "Fetch files and directories from GitHub"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
] }
url = "2"
