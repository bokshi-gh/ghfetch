[package]
name = "ghfetch"
version = "0.1.0"
edition = "2024"
description = "Fetch files and directories from GitHub"
license = "MIT"

[dependencies]
anyhow = "1"
async-recursion = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
