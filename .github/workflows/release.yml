name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: ghfetch-linux-x86_64.tar.gz

          - target: x86_64-pc-windows-msvc
            asset: ghfetch-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-xwin
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo install cargo-xwin

      - name: Build Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Build Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cargo xwin build \
            --release \
            --target ${{ matrix.target }}

      - name: Package Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir package

          cp \
            target/${{ matrix.target }}/release/ghfetch \
            package/ghfetch

          tar \
            -czf ${{ matrix.asset }} \
            -C package \
            ghfetch

      - name: Package Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          mkdir package

          cp \
            target/${{ matrix.target }}/release/ghfetch.exe \
            package/ghfetch.exe

          cd package

          zip \
            ../${{ matrix.asset }} \
            ghfetch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ghfetch ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
