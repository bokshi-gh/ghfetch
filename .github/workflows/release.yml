name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: ghfetch-linux-x86_64.tar.gz

          - target: x86_64-pc-windows-msvc
            asset: ghfetch-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Package Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/ghfetch package/ghfetch
          tar -czf ${{ matrix.asset }} -C package ghfetch

      - name: Package Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/ghfetch.exe package/ghfetch.exe
          cd package
          zip ../${{ matrix.asset }} ghfetch.exe

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ghfetch ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
