name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: ghfetch-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            archive: ghfetch-linux-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            archive: ghfetch-windows-x86_64.zip

          - target: aarch64-pc-windows-msvc
            archive: ghfetch-windows-aarch64.zip

          - target: x86_64-apple-darwin
            archive: ghfetch-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            archive: ghfetch-macos-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir package

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/ghfetch.exe" \
              package/ghfetch.exe

            cd package
            zip "../${{ matrix.archive }}" ghfetch.exe
          else
            cp "target/${{ matrix.target }}/release/ghfetch" \
              package/ghfetch

            cd package
            tar -czf "../${{ matrix.archive }}" ghfetch
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
