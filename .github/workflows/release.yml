name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir package
          cp target/release/ghfetch package/ghfetch
          tar -czf ghfetch-linux-x86_64.tar.gz -C package ghfetch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghfetch-linux-x86_64
          path: ghfetch-linux-x86_64.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package

          Copy-Item `
            target\release\ghfetch.exe `
            package\ghfetch.exe

          Compress-Archive `
            -Path package\ghfetch.exe `
            -DestinationPath ghfetch-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghfetch-windows-x86_64
          path: ghfetch-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs:
      - linux
      - windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ghfetch ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
