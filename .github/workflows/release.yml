name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Linux
          - name: Linux (x86_64)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: ghfetch-linux-x86_64.tar.gz
            binary: ghfetch
            format: tar.gz

          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: ghfetch-linux-aarch64.tar.gz
            binary: ghfetch
            format: tar.gz

          # macOS
          - name: macOS (x86_64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: ghfetch-macos-x86_64.tar.gz
            binary: ghfetch
            format: tar.gz

          - name: macOS (aarch64)
            os: macos-15
            target: aarch64-apple-darwin
            archive: ghfetch-macos-aarch64.tar.gz
            binary: ghfetch
            format: tar.gz

          # Windows
          - name: Windows (x86_64)
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: ghfetch-windows-x86_64.zip
            binary: ghfetch.exe
            format: zip

          - name: Windows (aarch64)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: ghfetch-windows-aarch64.zip
            binary: ghfetch.exe
            format: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package

          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "package/${{ matrix.binary }}"

          tar \
            -czf "${{ matrix.archive }}" \
            -C package \
            "${{ matrix.binary }}"

      - name: Package Windows
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            package

          Copy-Item `
            "target\${{ matrix.target }}\release\${{ matrix.binary }}" `
            "package\${{ matrix.binary }}"

          Compress-Archive `
            -Path "package\${{ matrix.binary }}" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghfetch-${{ matrix.target }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release

    needs:
      - build

    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ghfetch ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
